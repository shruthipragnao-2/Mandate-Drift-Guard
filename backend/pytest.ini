[pytest]
pythonpath = . ../eval
testpaths = tests
markers =
    smoke: network-dependent test against the real Anthropic API (requires ANTHROPIC_API_KEY). Excluded from the default run; include explicitly with `pytest -m smoke`.
    migration_roundtrip: downgrades the real Postgres schema to base and back, wiping every table (including dataset_cases) for the duration. Excluded from the default run; include explicitly with `pytest -m migration_roundtrip`.
addopts = -m "not smoke and not migration_roundtrip"
