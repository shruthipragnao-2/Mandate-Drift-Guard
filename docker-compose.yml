services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mandate_guard
      POSTGRES_PASSWORD: mandate_guard
      POSTGRES_DB: mandate_guard
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate_guard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://mandate_guard:mandate_guard@db:5432/mandate_guard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  db_data:
